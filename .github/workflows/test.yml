name: Conformance and reference tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12", "3.14"]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests (no third-party dependencies)
        run: python -m unittest discover -s tests -v
      - name: Demonstration
        run: python -m airshower demo --json
      - name: Compile package
        run: python -m compileall -q airshower
      - name: Desktop adapter tests (no npm dependencies)
        run: node --test integrations/desktop/tests/*.mjs
      - name: Build desktop packages
        run: python scripts/build_desktop.py
  p2p:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Fetch integrity-pinned native bindings (no install scripts)
        run: python scripts/fetch_p2p_dependencies.py
      - name: Build project-local native helpers
        run: python scripts/build_p2p_native.py
      - name: Offline encrypted P2P and permission tests
        run: node --test integrations/p2p/tests/*.test.mjs
      - name: Bundle self-contained Mac previews
        if: runner.os == 'macOS'
        run: |
          python scripts/fetch_p2p_runtime.py
          python scripts/build_p2p.py
          python scripts/verify_p2p_packages.py
