name: P2P public relay smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Prepare ephemeral fixture dependencies
        run: |
          python scripts/fetch_p2p_dependencies.py
          python scripts/build_p2p_native.py
      - name: Check public relay HTTPS reachability
        run: |
          for region in use1-1 usw1-1 euc1-1 aps1-1; do
            curl --max-time 12 --silent --show-error --output /dev/null --write-out "$region HTTPS %{http_code}\n" "https://$region.relay.n0.iroh.link./"
          done
      - name: Baseline public network fixture
        run: node integrations/p2p/tests/internet-smoke.mjs
      - name: Require encrypted relay fallback on this disposable runner
        run: |
          # This blocks direct QUIC, including loopback, only inside this
          # disposable CI machine. Preserve DNS queries AND replies from the
          # local resolver, plus TCP/HTTPS for public relays.
          sudo iptables -I OUTPUT 1 -p udp ! --dport 53 ! --sport 53 -j DROP
          sudo ip6tables -I OUTPUT 1 -p udp ! --dport 53 ! --sport 53 -j DROP
          node integrations/p2p/tests/internet-smoke.mjs --require-relay
