name: P2P public relay smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Prepare ephemeral fixture dependencies
        run: |
          python scripts/fetch_p2p_dependencies.py
          python scripts/build_p2p_native.py
      - name: Check public relay HTTPS reachability
        run: |
          for region in use1-1 usw1-1 euc1-1 aps1-1; do
            curl --max-time 12 --silent --show-error --output /dev/null --write-out "$region HTTPS %{http_code}\n" "https://$region.relay.n0.iroh.link./"
          done
      - name: Baseline public network fixture
        run: node integrations/p2p/tests/internet-smoke.mjs
      - name: Require encrypted relay fallback on this disposable runner
        run: |
          # Isolate packet loss to the fixture, preserving the runner's DNS,
          # networking and control channel. No machine-wide firewall changes.
          mkdir -p build
          cc -shared -fPIC -O2 -Wall -Wextra -Werror integrations/p2p/tests/drop-udp.c -ldl -o build/drop-udp.so
          LD_PRELOAD="$PWD/build/drop-udp.so" node integrations/p2p/tests/internet-smoke.mjs --require-relay
