<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">airshower</title>
  <desc id="desc">People connected, agents coordinated. An open proposal for permissioned agent collaboration.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1624"/><stop offset="1" stop-color="#142c39"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#b2f5da" stroke-opacity=".035"/></pattern></defs>
  <rect width="1200" height="400" rx="24" fill="url(#bg)"/><rect width="1200" height="400" rx="24" fill="url(#grid)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
    <text x="64" y="76" fill="#a6f3d4" font-size="13" letter-spacing="3">AN OPEN COLLABORATION PROPOSAL</text>
    <text x="60" y="165" fill="#f0f7f5" font-size="76" font-weight="650" letter-spacing="-4">airshower</text>
    <text x="64" y="214" fill="#b5c8cd" font-size="24">Your agent. Their agent. A shared understanding.</text>
    <g transform="translate(64 270)">
