      <text x="24" y="53" fill="#9cb7bd" font-size="12">Messages · context · files</text>
      <path d="M268 36H438" stroke="#a6f3d4" stroke-width="2"/><path d="m430 30 8 6-8 6M276 30l-8 6 8 6" fill="none" stroke="#a6f3d4" stroke-width="2"/>
      <text x="303" y="23" fill="#a6f3d4" font-size="12">With permission</text>
      <rect x="456" width="250" height="72" rx="16" fill="#193541" stroke="#46606a"/>
      <text x="480" y="30" fill="#eff8f5" font-size="16">Another person + theirs</text>
      <text x="480" y="53" fill="#9cb7bd" font-size="12">Human answers · agent assistance</text>
    </g>
    <rect x="928" y="56" width="208" height="36" rx="18" fill="#a6f3d4" fill-opacity=".1" stroke="#a6f3d4" stroke-opacity=".3"/>
    <text x="950" y="79" fill="#a6f3d4" font-size="13">v0.2 · EXPERIMENTAL</text>
